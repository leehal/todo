spring.application.name=todo

# PostgreSQL (local Homebrew postgresql@18, trust auth for local connections)
spring.datasource.url=jdbc:postgresql://localhost:5432/todo
spring.datasource.username=${DB_USERNAME:${USER}}
spring.datasource.password=${DB_PASSWORD:}

# Dev convenience: create/update tables from entities. Switch to Flyway before production.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
